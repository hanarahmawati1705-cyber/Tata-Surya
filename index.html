<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tata Surya Interaktif</title>
<style>
:root{--bg:#04060d;--panel:#0d1322;--line:#273253;--tx:#eaeefb;--mut:#9fabcc;--ac:#ffb84d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:10px 16px 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;letter-spacing:.02em;font-weight:700}
header span{color:var(--mut);font-size:.82rem}
#stage{flex:1;min-height:200px;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px}
#chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:999px;padding:6px 12px;font:inherit;font-size:.82rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:#1b1200;border-color:var(--ac);font-weight:700}
#info h2{margin:0 0 2px;font-size:1.05rem}
#stats{color:var(--mut);font-size:.8rem;margin-bottom:6px}
#txt{margin:0;font-size:.95rem;line-height:1.55;max-width:70ch;min-height:4.6em}
#ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{border:1px solid var(--line);background:#16203a;color:var(--tx);border-radius:10px;padding:9px 14px;font:inherit;font-size:.88rem;cursor:pointer}
button.b.main{background:var(--ac);color:#1b1200;border-color:var(--ac);font-weight:700}
button:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:.82rem}
#note{color:#ffcf8a;font-size:.78rem;display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Animasi tata surya"></canvas></div>
<div id="panel">
  <div id="chips" role="group" aria-label="Pilih benda langit"></div>
  <div id="ctl">
    <button class="b main" id="tour">▶ Mulai tur</button>
    <button class="b" id="prev" aria-label="Sebelumnya">⏮</button>
    <button class="b" id="next" aria-label="Berikutnya">⏭</button>
    <button class="b" id="mute" aria-pressed="false">🔊 Suara aktif</button>
    <label>Kecepatan orbit <input type="range" id="spd" min="0" max="3" step="0.1" value="1"></label>
  </div>
  <div id="note"></div>
</div>
<script>
const B=[
{n:'Matahari',c:'#ffc23d',s:20,r:0,P:0,d:'1.392.000 km',j:'pusat tata surya',t:'-',x:'Matahari adalah bintang di pusat tata surya. Diameternya sekitar 1,4 juta kilometer, dan massanya mencakup lebih dari 99 persen seluruh massa tata surya. Di intinya, hidrogen menyatu menjadi helium dan melepaskan energi yang kita rasakan sebagai cahaya dan panas.'},
{n:'Merkurius',c:'#b8b2a8',s:3.5,r:.17,P:.24,d:'4.879 km',j:'58 juta km',t:'88 hari',x:'Merkurius adalah planet terdekat dari Matahari dan yang terkecil. Satu tahunnya hanya 88 hari Bumi. Karena hampir tidak punya atmosfer, suhu siangnya bisa mencapai sekitar 430 derajat Celsius, sedangkan malamnya turun hingga sekitar minus 180.'},
{n:'Venus',c:'#e6c27a',s:6,r:.26,P:.62,d:'12.104 km',j:'108 juta km',t:'225 hari',x:'Venus hampir sama besar dengan Bumi, tetapi diselimuti atmosfer karbon dioksida yang sangat tebal. Efek rumah kaca membuat permukaannya sekitar 465 derajat Celsius, planet terpanas di tata surya. Venus juga berputar terbalik, dan satu hari Venus lebih panjang dari satu tahunnya.'},
{n:'Bumi',c:'#4b93e8',s:6.5,r:.36,P:1,d:'12.742 km',j:'150 juta km',t:'365 hari',x:'Bumi adalah satu-satunya tempat yang kita ketahui memiliki kehidupan. Sekitar 71 persen permukaannya tertutup air, dan atmosfernya melindungi kita. Bumi punya satu satelit alami, yaitu Bulan, dan mengelilingi Matahari dalam 365 hari.'},
{n:'Mars',c:'#d9603b',s:4.5,r:.46,P:1.88,d:'6.779 km',j:'228 juta km',t:'687 hari',x:'Mars dijuluki planet merah karena debunya kaya oksida besi. Di sana terdapat Olympus Mons, gunung berapi tertinggi di tata surya, sekitar 22 kilometer. Mars punya dua bulan kecil, Phobos dan Deimos, dan para ilmuwan menemukan jejak air kuno di permukaannya.'},
{n:'Jupiter',c:'#d8a77a',s:13,r:.6,P:11.86,d:'139.820 km',j:'778 juta km',t:'11,9 tahun',x:'Jupiter adalah planet terbesar, cukup luas untuk memuat lebih dari seribu Bumi. Planet gas raksasa ini punya Bintik Merah Besar, badai raksasa yang sudah berlangsung selama berabad-abad. Jupiter memiliki puluhan bulan, termasuk Ganymede, bulan terbesar di tata surya.'},
{n:'Saturnus',c:'#e3cf94',s:11,r:.74,P:29.46,d:'116.460 km',j:'1,43 miliar km',t:'29,5 tahun',ring:1,x:'Saturnus terkenal dengan cincinnya yang megah, tersusun dari kepingan es dan batu. Planet gas raksasa ini sangat ringan; kepadatan rata-ratanya lebih kecil dari air. Salah satu bulannya, Titan, memiliki atmosfer tebal dan danau metana.'},
{n:'Uranus',c:'#7fd6e0',s:8,r:.87,P:84,d:'50.724 km',j:'2,87 miliar km',t:'84 tahun',x:'Uranus adalah raksasa es yang berputar miring, hampir menggelinding di sisinya saat mengorbit. Atmosfernya yang mengandung metana memberi warna biru kehijauan. Satu tahun di Uranus setara sekitar 84 tahun Bumi.'},
{n:'Neptunus',c:'#3f63e0',s:8,r:.98,P:164.8,d:'49.244 km',j:'4,5 miliar km',t:'165 tahun',x:'Neptunus adalah planet terjauh dari Matahari, gelap, dingin, dan diterpa angin tercepat di tata surya, melebihi 2.000 kilometer per jam. Satu kali mengorbit memakan waktu sekitar 165 tahun Bumi.'}
];
const INTRO='Selamat datang di tata surya. Mari kita bepergian dari pusat menuju tepi tata surya kita. ';
const OUTRO='Demikian perjalanan kita melintasi tata surya. Di luar Neptunus masih ada sabuk Kuiper dengan planet kerdil seperti Pluto. Terima kasih telah menyimak.';
const $=id=>document.getElementById(id);
const cv=$('cv'),g=cv.getContext('2d');
let W=0,H=0,dpr=1,cx=0,cy=0,maxR=0,k=1,sel=-1,touring=false,muted=false,token=0,voice=null,spd=1,last=0;
B.forEach((b,i)=>{b.a=i*1.3;b.x0=0;b.y0=0});
const stars=Array.from({length:160},()=>({x:Math.random(),y:Math.random(),z:Math.random()*1.2+.3,p:Math.random()*6}));
function size(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;maxR=Math.min(W,H)/2-14;k=Math.max(.5,maxR/400)}
addEventListener('resize',size);size();
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(n){const c=document.createElement('canvas');c.width=c.height=n;return c}
function blob(x,px,py,rad,col,r){x.fillStyle=col;x.beginPath();for(let a=0;a<6.3;a+=.5){const q=rad*(.6+r()*.7);x.lineTo(px+Math.cos(a)*q,py+Math.sin(a)*q)}x.closePath();x.fill()}
function bands(x,N,cols,amp,seed,hm){const r=rng(seed);let y=-4;while(y<N){const h=(3+r()*N*.08)*hm;x.fillStyle=cols[Math.floor(r()*cols.length)];x.beginPath();x.moveTo(0,y);for(let i=0;i<=N;i+=8)x.lineTo(i,y+Math.sin(i*.04+y)*amp);x.lineTo(N,y+h+amp);x.lineTo(0,y+h+amp);x.fill();y+=h}
  for(let i=0;i<90;i++){x.fillStyle=r()>.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.07)';x.fillRect(0,r()*N,N,1+r()*3)}}
function tex(i){const N=256,c=mk(N),x=c.getContext('2d'),r=rng(i*77+5);
  if(i===0){x.fillStyle='#ff9a1a';x.fillRect(0,0,N,N);
    for(let q=0;q<1400;q++){x.fillStyle=r()>.5?'rgba(255,235,130,.35)':'rgba(190,60,0,.3)';x.beginPath();x.arc(r()*N,r()*N,2+r()*7,0,7);x.fill()}
    for(let q=0;q<7;q++){const px=60+r()*140,py=70+r()*110;x.fillStyle='rgba(70,18,0,.75)';x.beginPath();x.arc(px,py,2+r()*4,0,7);x.fill()}}
  else if(i===1){x.fillStyle='#8d8a85';x.fillRect(0,0,N,N);
    for(let q=0;q<500;q++){x.fillStyle='rgba('+(r()>.5?'60,58,55':'175,170,160')+',.25)';x.beginPath();x.arc(r()*N,r()*N,1+r()*5,0,7);x.fill()}
    for(let q=0;q<60;q++){const px=r()*N,py=r()*N,s=3+r()*10;x.strokeStyle='rgba(215,210,200,.5)';x.lineWidth=1;x.beginPath();x.arc(px,py,s,0,7);x.stroke();x.fillStyle='rgba(40,38,36,.4)';x.beginPath();x.arc(px+1,py+1,s*.8,0,7);x.fill()}}
  else if(i===2){x.fillStyle='#e2c27d';x.fillRect(0,0,N,N);bands(x,N,['#e8cc8c','#d9b36b','#efd9a2','#c9a25a'],9,21,.7)}
  else if(i===3){const og=x.createLinearGradient(0,0,0,N);og.addColorStop(0,'#2a6fc2');og.addColorStop(.5,'#1b55a8');og.addColorStop(1,'#2a6fc2');x.fillStyle=og;x.fillRect(0,0,N,N);
    for(let q=0;q<9;q++){const px=r()*N,py=40+r()*176;for(let m=0;m<6;m++)blob(x,px+(r()-.5)*40,py+(r()-.5)*30,8+r()*16,['#3f7d3a','#5f8f3e','#9a8a52','#2f6b34'][Math.floor(r()*4)],r)}
    x.fillStyle='#f2f6fa';x.fillRect(0,0,N,13);x.fillRect(0,N-15,N,15);
    for(let q=0;q<45;q++){x.fillStyle='rgba(255,255,255,'+(.2+r()*.3)+')';x.beginPath();x.ellipse(r()*N,r()*N,10+r()*28,3+r()*6,(r()-.5)*.6,0,7);x.fill()}}
  else if(i===4){x.fillStyle='#b9552f';x.fillRect(0,0,N,N);
    for(let q=0;q<30;q++)blob(x,r()*N,40+r()*176,6+r()*20,r()>.5?'rgba(110,48,28,.5)':'rgba(222,140,90,.4)',r);
    x.fillStyle='#f5f2ee';x.beginPath();x.ellipse(N/2,2,70,14,0,0,7);x.fill();x.beginPath();x.ellipse(N/2,N-2,50,9,0,0,7);x.fill()}
  else if(i===5){x.fillStyle='#d9b88f';x.fillRect(0,0,N,N);bands(x,N,['#d9b88f','#b9814f','#efe0c4','#a76a3d','#e5c9a0'],5,31,.8);
    x.fillStyle='#b8472f';x.beginPath();x.ellipse(150,176,24,13,0,0,7);x.fill();x.strokeStyle='rgba(240,220,190,.6)';x.lineWidth=3;x.stroke()}
  else if(i===6){x.fillStyle='#e3cf94';x.fillRect(0,0,N,N);bands(x,N,['#e8d7a5','#d5bd82','#f1e4bd','#c9ad73'],2,41,.9)}
  else if(i===7){x.fillStyle='#8fdde3';x.fillRect(0,0,N,N);bands(x,N,['#8fdde3','#86d4dc','#9ae3e8'],1,51,1.4)}
  else{x.fillStyle='#3a64e6';x.fillRect(0,0,N,N);bands(x,N,['#2f56d6','#3a64e6','#2547b8','#4f7bf0'],3,61,1);
    x.fillStyle='rgba(15,25,90,.7)';x.beginPath();x.ellipse(130,110,22,11,0,0,7);x.fill();
    x.fillStyle='rgba(255,255,255,.5)';x.beginPath();x.ellipse(165,120,12,2.5,0,0,7);x.fill()}
  return c}
const TX=B.map((_,i)=>tex(i));
const belt=Array.from({length:320},()=>({a:Math.random()*6.28,r:.515+Math.random()*.07,z:Math.random()*1.4+.5,o:Math.random()*.5+.3}));
const GL={2:'255,215,140',3:'100,165,255',4:'255,140,90'};
let bg=null,bw=0,bh=0;
function mkBg(){bw=W;bh=H;bg=document.createElement('canvas');bg.width=W;bg.height=H;const x=bg.getContext('2d'),r=rng(11);
  x.fillStyle='#02030a';x.fillRect(0,0,W,H);
  [[.2,.25,'90,60,170',.14],[.8,.7,'40,90,190',.12],[.65,.15,'160,60,110',.08],[.3,.85,'50,120,160',.09]].forEach(([a,b,c,o])=>{const R=Math.max(W,H)*.55,gr=x.createRadialGradient(W*a,H*b,0,W*a,H*b,R);gr.addColorStop(0,'rgba('+c+','+o+')');gr.addColorStop(1,'rgba('+c+',0)');x.fillStyle=gr;x.fillRect(0,0,W,H)});
  x.save();x.translate(W/2,H/2);x.rotate(-.5);const mw=x.createLinearGradient(0,-H*.3,0,H*.3);mw.addColorStop(0,'rgba(160,170,220,0)');mw.addColorStop(.5,'rgba(170,180,230,.09)');mw.addColorStop(1,'rgba(160,170,220,0)');x.fillStyle=mw;x.fillRect(-W,-H*.3,W*2,H*.6);
  for(let i=0;i<1800;i++){x.fillStyle='rgba(220,230,255,'+(.15+r()*.5)+')';x.fillRect((r()-.5)*W*1.8,(r()+r()-1)*H*.3,1,1)}x.restore();
  for(let i=0;i<350;i++){x.fillStyle='rgba('+(r()>.7?'255,230,190':'210,225,255')+','+(.25+r()*.6)+')';const z=r()>.96?2:1;x.fillRect(r()*W,r()*H,z,z)}}
const R=i=>(i===0?B[0].s:B[i].s*1.35)*k;
function sphere(i,rr,x,y){g.save();g.beginPath();g.arc(x,y,rr,0,7);g.clip();g.drawImage(TX[i],x-rr,y-rr,rr*2,rr*2);
  const la=Math.atan2(cy-y,cx-x),lx=x+Math.cos(la)*rr*.55,ly=y+Math.sin(la)*rr*.55;
  const sh=g.createRadialGradient(lx,ly,rr*.15,lx,ly,rr*1.7);sh.addColorStop(0,'rgba(0,0,8,0)');sh.addColorStop(.5,'rgba(0,0,8,.15)');sh.addColorStop(1,'rgba(0,0,8,.93)');
  g.fillStyle=sh;g.fillRect(x-rr,y-rr,rr*2,rr*2);g.restore()}
function ring(rr,x,y,front){g.save();g.translate(x,y);g.rotate(-.32);
  [[1.3,1.5,'rgba(160,140,110,.45)'],[1.52,1.85,'rgba(232,214,170,.85)'],[1.92,2.15,'rgba(205,185,140,.75)'],[2.2,2.3,'rgba(190,170,130,.4)']].forEach(([a,b,c])=>{
    const m=(a+b)/2*rr;g.strokeStyle=c;g.lineWidth=(b-a)*rr;g.beginPath();g.ellipse(0,0,m,m*.3,0,front?0:Math.PI,front?Math.PI:Math.PI*2);g.stroke()});g.restore()}
function sun(t){const sr=B[0].s*k,fl=1+.04*Math.sin(t/350)+.03*Math.sin(t/910),cr=sr*4.2*fl;
  const gl=g.createRadialGradient(cx,cy,sr*.9,cx,cy,cr);gl.addColorStop(0,'rgba(255,170,50,.55)');gl.addColorStop(.25,'rgba(255,120,30,.18)');gl.addColorStop(1,'rgba(255,100,20,0)');
  g.fillStyle=gl;g.beginPath();g.arc(cx,cy,cr,0,7);g.fill();
  g.save();g.translate(cx,cy);g.rotate(t/9000);for(let q=0;q<14;q++){g.rotate(.4488);g.fillStyle='rgba(255,200,100,.05)';g.beginPath();g.moveTo(0,-sr*.9);g.lineTo(sr*.25,-sr*(2.2+.5*Math.sin(t/500+q)));g.lineTo(-sr*.25,-sr*.9);g.fill()}g.restore();
  g.save();g.beginPath();g.arc(cx,cy,sr,0,7);g.clip();g.translate(cx,cy);g.rotate(t/30000);g.drawImage(TX[0],-sr*1.45,-sr*1.45,sr*2.9,sr*2.9);g.restore();
  const ld=g.createRadialGradient(cx,cy,sr*.5,cx,cy,sr);ld.addColorStop(0,'rgba(255,200,80,0)');ld.addColorStop(1,'rgba(160,40,0,.65)');g.fillStyle=ld;g.beginPath();g.arc(cx,cy,sr,0,7);g.fill()}
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(!bg||bw!==W||bh!==H)mkBg();
  g.globalAlpha=1;g.drawImage(bg,0,0);
  stars.forEach(s=>{g.globalAlpha=.3+.4*Math.sin(t/900+s.p);g.fillStyle=['#fff','#cfe0ff','#ffe9c4'][Math.floor(s.p)%3];const sx=s.x*W,sy=s.y*H;g.fillRect(sx,sy,s.z,s.z);if(s.z>1.4){g.fillRect(sx-3,sy+s.z/2,7,.6);g.fillRect(sx+s.z/2,sy-3,.6,7)}});
  g.globalAlpha=1;
  B.forEach((b,i)=>{if(i===0){b.x0=cx;b.y0=cy;return}
    g.strokeStyle=i===sel?'rgba(255,184,77,.55)':'rgba(120,140,200,.16)';g.lineWidth=1;g.beginPath();g.arc(cx,cy,b.r*maxR,0,7);g.stroke();
    b.a+=dt*spd*1.3/Math.pow(b.P,.8);b.x0=cx+Math.cos(b.a)*b.r*maxR;b.y0=cy+Math.sin(b.a)*b.r*maxR});
  belt.forEach(a=>{a.a+=dt*spd*.12;g.fillStyle='rgba(190,180,165,'+a.o+')';g.fillRect(cx+Math.cos(a.a)*a.r*maxR,cy+Math.sin(a.a)*a.r*maxR,a.z,a.z)});
  sun(t);
  for(let i=1;i<B.length;i++){const b=B[i],rr=R(i),x=b.x0,y=b.y0;
    if(GL[i]){const gg=g.createRadialGradient(x,y,rr*.9,x,y,rr*1.45);gg.addColorStop(0,'rgba('+GL[i]+',.5)');gg.addColorStop(1,'rgba('+GL[i]+',0)');g.fillStyle=gg;g.beginPath();g.arc(x,y,rr*1.45,0,7);g.fill()}
    if(b.ring)ring(rr,x,y,false);
    sphere(i,rr,x,y);
    if(b.ring)ring(rr,x,y,true);
    if(i===3){const m=b.a*12,mr=Math.max(1.6,rr*.27),mx=x+Math.cos(m)*rr*2.3,my=y+Math.sin(m)*rr*2.3,la=Math.atan2(cy-my,cx-mx);
      const mg=g.createRadialGradient(mx+Math.cos(la)*mr*.4,my+Math.sin(la)*mr*.4,mr*.1,mx,my,mr*1.1);mg.addColorStop(0,'#e4e2de');mg.addColorStop(1,'#25252a');g.fillStyle=mg;g.beginPath();g.arc(mx,my,mr,0,7);g.fill()}}
  if(sel>=0){const b=B[sel],rr=R(sel),p=1+.15*Math.sin(t/220);g.strokeStyle='#ffb84d';g.lineWidth=2;g.beginPath();g.arc(b.x0,b.y0,(rr+8)*p+(b.ring?rr*1.1:0),0,7);g.stroke()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Chip
const chips=$('chips');
B.forEach((b,i)=>{const e=document.createElement('button');e.className='chip';e.textContent=b.n;e.setAttribute('aria-pressed','false');e.onclick=()=>{touring=false;setTour();speak(i,false)};chips.appendChild(e)});
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=-1,bd=1e9;
  B.forEach((b,i)=>{const d=Math.hypot(b.x0-x,b.y0-y),lim=Math.max((i===0?b.s:b.s*1.35)*k+12,22);if(d<lim&&d<bd){bd=d;best=i}});
  if(best>=0){touring=false;setTour();speak(best,false)}
});

// Suara
const hasTTS='speechSynthesis' in window;
function pickVoice(){if(!hasTTS)return;const v=speechSynthesis.getVoices();voice=v.find(x=>/^id/i.test(x.lang))||null;
  const n=$('note');if(v.length&&!voice){n.style.display='block';n.textContent='Suara bahasa Indonesia tidak ditemukan di perangkat ini, jadi narasi memakai suara bawaan. Pasang suara Indonesia lewat pengaturan sistem untuk hasil terbaik.'}else n.style.display='none'}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;setTimeout(pickVoice,1200)}
else{$('note').style.display='block';$('note').textContent='Peramban ini tidak mendukung suara narasi. Teks tetap tampil dan tur berjalan otomatis.'}

function show(i){
  sel=i;
  [...chips.children].forEach((c,j)=>c.setAttribute('aria-pressed',j===i?'true':'false'));
  chips.children[i].scrollIntoView({block:'nearest',inline:'center'});
}
function speak(i,inTour){
  const my=++token;show(i);
  if(hasTTS)speechSynthesis.cancel();
  let text=B[i].x;if(inTour&&i===0)text=INTRO+text;if(inTour&&i===B.length-1)text+=' '+OUTRO;
  const done=()=>{if(my!==token||!touring)return;
    if(i===B.length-1){touring=false;setTour();return}
    setTimeout(()=>{if(my===token&&touring)speak(i+1,true)},700)};
  if(!hasTTS||muted){if(inTour||muted)setTimeout(done,Math.max(2500,text.length*55));return}
  const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';if(voice)u.voice=voice;u.rate=.95;
  u.onend=done;u.onerror=()=>{};
  speechSynthesis.speak(u);
}
function setTour(){$('tour').textContent=touring?'⏸ Jeda tur':'▶ '+(sel>=0&&sel<B.length-1&&paused?'Lanjutkan tur':'Mulai tur')}
let paused=false;
$('tour').onclick=()=>{
  if(touring){touring=false;paused=true;token++;if(hasTTS)speechSynthesis.cancel();setTour();return}
  touring=true;paused=false;setTour();speak(paused||sel<0||sel>=B.length-1?0:sel,true);
};
function go(d){const i=Math.min(B.length-1,Math.max(0,(sel<0?-1:sel)+d));if(touring)speak(i,true);else speak(i,false)}
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('mute').onclick=e=>{muted=!muted;e.target.setAttribute('aria-pressed',muted);e.target.textContent=muted?'🔇 Suara mati':'🔊 Suara aktif';if(muted&&hasTTS)speechSynthesis.cancel()};
$('spd').oninput=e=>spd=+e.target.value;
</script>
